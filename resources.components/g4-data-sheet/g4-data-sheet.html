<!--
    G4 data sheet: the iterations of a plan as rows, with the data columns of each plan item grouped
    under the item's header. The component fills this markup; see g4-data-sheet.js.
-->
<template id="g4-data-sheet-template">
    <div class="g4-data-sheet" data-test-id="sheet">
        <div class="g4-data-sheet__scroll" data-part="scroll" data-test-id="scroll">
            <table class="g4-data-sheet__table" data-part="table" data-test-id="table">
                <thead data-part="head"></thead>
                <tbody data-part="body"></tbody>
            </table>
            <div class="g4-data-sheet__empty"
                 data-part="empty"
                 data-test-id="empty-message"
                 hidden></div>
        </div>
        <div class="g4-data-sheet__footer" data-test-id="footer">
            <button type="button"
                    class="g4-data-sheet__add"
                    title="Add an iteration: a copy of the last one, for every bot"
                    data-part="add"
                    data-test-id="add-iteration-button">
                <span class="g4-data-sheet__icon" data-icon="add"></span>
                <span>Add Iteration</span>
            </button>
            <span class="g4-data-sheet__summary" data-part="summary" data-test-id="iterations-summary"></span>
        </div>
    </div>
</template>
